<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Nutrition - Analisis Gizi</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght=800&family=Poppins:wght=400;700&display=swap');

        * { box-sizing: border-box; }
        
        body { 
            margin: 0; padding: 0; 
            background-color: #a2c9e8; /* Warna biru langit background */
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            height: 100vh;
        }

        /* HEADER COKELAT DENGAN POLA */
        .header {
            background-color: #5b3d36;
            background-image: url('https://www.transparenttextures.com/patterns/food.png');
            padding: 25px 10px;
            text-align: center;
            border-bottom: 6px solid #452b25;
            position: relative;
            z-index: 100;
        }
        .header h1 {
            color: #fff; font-family: 'Montserrat', sans-serif;
            font-size: 45px; margin: 0; text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* LAYER STIKER (Tetap di belakang konten) */
        .sticker-bg {
            position: fixed;
            top: 120px; left: 0; width: 100%; height: calc(100% - 120px);
            z-index: 1;
            pointer-events: none;
        }
        .stiker {
            position: absolute;
            width: 140px;
            filter: drop-shadow(5px 5px 0px white); /* Outline putih khas stiker */
        }

        /* AREA KONTEN UTAMA */
        .content-area {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        /* --- DESAIN HALAMAN DASHBOARD (gmbr1.jpg) --- */
        #dashboard {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .scanner-container {
            background: white;
            padding: 10px;
            border-radius: 40px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            width: 450px; max-width: 90vw;
            border: 20px solid white;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #reader { width: 100% !important; border: none !important; }

        .input-bar {
            background: white;
            padding: 8px 8px 8px 30px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            width: 500px; max-width: 85vw;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .input-bar input {
            border: none; flex-grow: 1; font-size: 20px; outline: none;
        }
        .btn-cek {
            background-color: #c474df; /* Warna ungu tombol */
            color: black; border: none; padding: 12px 35px;
            border-radius: 15px; font-weight: 800; font-size: 20px; cursor: pointer;
        }

        /* --- DESAIN HALAMAN HASIL (gmbr2.jpg) --- */
        #result-page {
            display: none;
            background-color: #f3f1eb; /* Warna krem cerah */
            width: 95%; max-width: 900px;
            border-radius: 0px; /* Sesuai gambar yang flat ke sisi */
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            overflow: hidden;
            margin-top: 20px;
        }

        .res-top { display: flex; align-items: center; padding: 40px; gap: 30px; }
        .res-img-placeholder {
            background: #b35252; color: white; width: 110px; height: 110px;
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 12px; font-weight: bold; padding: 10px;
        }
        .res-img-placeholder img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 15px;
        }
        .res-product-name { font-size: 32px; font-weight: 800; text-transform: uppercase; }

        .res-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; padding: 0 40px 40px;
        }
        .nutri-item {
            background: #b35252; /* Warna merah bata/marun */
            color: white; height: 120px; border-radius: 30px;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; font-weight: bold;
        }
        .nutri-item span { font-weight: normal; font-size: 14px; margin-top: 5px; opacity: 0.9; }

        .res-footer {
            background: #b35252; color: white; padding: 35px;
        }
        .footer-label {
            font-weight: 800; font-size: 22px; margin-bottom: 15px;
            display: flex; align-items: center; gap: 15px;
        }
        .footer-text { font-size: 17px; line-height: 1.6; opacity: 0.95; }
    </style>
</head>
<body>

<div class="header">
    <h1>GROCERY NUTRITION</h1>
</div>

<div class="sticker-bg">
    <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" class="stiker" style="top: 5%; left: 5%; transform: rotate(-15deg);">
    <img src="https://cdn-icons-png.flaticon.com/512/2405/2405479.png" class="stiker" style="top: 2%; right: 10%; transform: rotate(10deg);">
    <img src="https://cdn-icons-png.flaticon.com/512/3050/3050158.png" class="stiker" style="bottom: 15%; left: 2%; width: 150px;">
    <img src="https://cdn-icons-png.flaticon.com/512/2722/2722527.png" class="stiker" style="bottom: 10%; right: 5%; width: 130px; transform: rotate(-10deg);">
    <img src="https://cdn-icons-png.flaticon.com/512/3143/3143640.png" class="stiker" style="top: 40%; right: 15%; width: 100px; opacity: 0.8;">
</div>

<div class="content-area">
    <div id="dashboard">
        <div class="scanner-container">
            <div id="reader"></div>
        </div>
        <div class="input-bar">
            <input type="text" id="manualCode" placeholder="ketik kode manual">
            <button class="btn-cek" onclick="prosesBarcode(document.getElementById('manualCode').value)">CEK</button>
        </div>
    </div>

    <div id="result-page">
        <div class="res-top">
            <div class="res-img-placeholder" id="pImg">GAMBAR PRODUK</div>
            <div class="res-product-name" id="pNama">NAMA PRODUK</div>
        </div>

        <div class="res-grid">
            <div class="nutri-item">KALORI<br><span id="v1">-</span></div>
            <div class="nutri-item">GARAM<br><span id="v2">-</span></div>
            <div class="nutri-item">GULA<br><span id="v3">-</span></div>
            <div class="nutri-item">PROTEIN<br><span id="v4">-</span></div>
            <div class="nutri-item">KARBOHIDRAT<br><span id="v5">-</span></div>
            <div class="nutri-item">LEMAK<br><span id="v6">-</span></div>
        </div>

        <div class="res-footer">
            <div class="footer-label">📋 PERINGATAN KESEHATAN</div>
            <div class="footer-text" id="vAnalisis">
                Menghitung analisis gizi...
            </div>
            <button onclick="location.reload()" style="margin-top:20px; padding:10px 20px; cursor:pointer; border-radius:10px; border:none; font-weight:bold;">KEMBALI SCAN</button>
        </div>
    </div>
</div>

<script>
    // Logika Scanner
    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
        html5QrCode.stop();
        prosesBarcode(decodedText);
    }).catch(err => {
        console.log("Kamera tidak diizinkan atau tidak ditemukan.");
    });

    function prosesBarcode(barcode) {
        if(!barcode) return;

        // Tampilkan pesan loading sementara mengambil data dari internet
        document.getElementById('manualCode').value = "Memuat data...";
        
        // Ambil data asli dari API OpenFoodFacts secara Real-Time
        fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`)
            .then(response => response.json())
            .then(data => {
                // Sembunyikan Dashboard, Tampilkan Halaman Hasil
                document.getElementById('dashboard').style.display = 'none';
                document.getElementById('result-page').style.display = 'block';

                if (data.status === 1) {
                    const produk = data.product;
                    const nutrisi = produk.nutriments || {};

                    // 1. Tampilkan Nama Produk
                    document.getElementById('pNama').innerText = produk.product_name || "PRODUK TANPA NAMA";

                    // 2. Tampilkan Gambar Produk jika ada di database
                    if (produk.image_front_small_url) {
                        document.getElementById('pImg').innerHTML = `<img src="${produk.image_front_small_url}" alt="Produk">`;
                    } else {
                        document.getElementById('pImg').innerText = "NO IMAGE";
                    }

                    // 3. Ambil Nilai Gizi per 100g (Garam menggunakan sodium)
                    const kalori = Math.round(nutrisi['energy-kcal_100g'] || 0);
                    const sodium = Math.round(nutrisi.sodium_100g * 1000 || 0); // diubah ke mg
                    const gula = Math.round(nutrisi.sugars_100g || 0);
                    const protein = Math.round(nutrisi.protein_100g || 0);
                    const karbo = Math.round(nutrisi.carbohydrates_100g || 0);
                    const lemak = Math.round(nutrisi.fat_100g || 0);

                    // Masukkan ke box grid
                    document.getElementById('v1').innerText = kalori + " kkal";
                    document.getElementById('v2').innerText = sodium + " mg";
                    document.getElementById('v3').innerText = gula + " g";
                    document.getElementById('v4').innerText = protein + " g";
                    document.getElementById('v5').innerText = karbo + " g";
                    document.getElementById('v6').innerText = lemak + " g";

                    // 4. Logika Analisis Peringatan Kesehatan Otomatis (Standar Kemenkes/WHO)
                    let teksAnalisis = `Produk ini mengandung <b>${kalori} kkal kalori</b> per 100 gram.<br><br>`;
                    let dapatPeringatan = false;

                    // Cek batas garam tinggi (>600mg per 100g)
                    if (sodium > 600) {
                        teksAnalisis += "⚠️ <b>PERINGATAN GARAM TINGGI:</b> Kandungan natrium/garam sangat tinggi. Batas konsumsi garam harian maksimal menurut Kemenkes RI adalah 2000 mg (1 sendok teh). Konsumsi berlebih memicu Hipertensi.<br><br>";
                        dapatPeringatan = true;
                    }
                    // Cek batas gula tinggi (>15g per 100g)
                    if (gula > 15) {
                        teksAnalisis += "⚠️ <b>PERINGATAN GULA TINGGI:</b> Makanan ini tinggi gula. Batas konsumsi gula harian maksimal Kemenkes RI adalah 50 gram (4 sendok makan). Konsumsi gula berlebih dapat memicu Diabetes Tipe 2 dan Obesitas.<br><br>";
                        dapatPeringatan = true;
                    }
                    // Cek batas lemak jenuh/tinggi (>20g per 100g)
                    if (lemak > 20) {
                        teksAnalisis += "⚠️ <b>PERINGATAN LEMAK TINGGI:</b> Kandungan lemak pada makanan ini cukup tinggi. Batas konsumsi lemak harian maksimal Kemenkes RI adalah 67 gram. Konsumsi berlebih berisiko menyumbat pembuluh darah dan memicu Kolesterol tinggi.<br><br>";
                        dapatPeringatan = true;
                    }

                    // Jika produk tergolong aman/sehat
                    if (!dapatPeringatan) {
                        teksAnalisis += "✅ <b>INFO KESEHATAN:</b> Kandungan gula, garam, dan lemak dalam batas normal per 100g. Tetap konsumsi secara bijak dan kombinasikan dengan makanan segar bergizi seimbang sesuai anjuran Isi Piringku Kemenkes.";
                    }

                    document.getElementById('vAnalisis').innerHTML = teksAnalisis;

                } else {
                    // Jika barcode tidak terdaftar di database dunia
                    document.getElementById('pNama').innerText = "PRODUK TIDAK DIKENAL";
                    document.getElementById('pImg').innerText = "??";
                    document.getElementById('vAnalisis').innerHTML = `❌ Barcode <b>${barcode}</b> tidak ditemukan di database online.<br><br>Gunakan fitur ketik manual atau pastikan kemasan produk memiliki barcode standar retail yang valid.`;
                    
                    // Reset grid jadi strip
                    for(let i=1; i<=6; i++) { document.getElementById('v'+i).innerText = "-"; }
                }
            })
            .catch(error => {
                console.error("Error mengambil data:", error);
                alert("Gagal koneksi internet atau server database sibuk.");
            });
    }
</script>

</body>
</html>
